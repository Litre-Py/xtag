[package]
name = "uwb-card-app"
version = "1.0.0"
description = "UWB Card - 近场卡片共享"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "uwb_card_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
